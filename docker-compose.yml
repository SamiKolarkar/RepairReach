services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repairreach-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - repairreach-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repairreach-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env.local
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      backend:
        condition: service_started
    networks:
      - repairreach-network

networks:
  repairreach-network:
    driver: bridge
